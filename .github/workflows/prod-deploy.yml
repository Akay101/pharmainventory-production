name: Production Deploy Backend

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      ####################################################
      # LOGIN TO DOCKER HUB
      ####################################################
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################################
      # BUILD PRODUCTION API IMAGE
      ####################################################
      - name: Build Backend API Docker Image
        run: |
          docker build \
            -f ./backend-node/Dockerfile \
            -t pharmalogy/pharmalogy-backend:prod \
            ./backend-node

      ####################################################
      # BUILD PRODUCTION WORKER IMAGE
      ####################################################
      - name: Build Worker Docker Image
        run: |
          docker build \
            -f ./backend-node/Dockerfile.worker \
            -t pharmalogy/pharmalogy-worker:prod \
            ./backend-node

      ####################################################
      # PUSH IMAGES TO DOCKER HUB
      ####################################################
      - name: Push Backend API Docker Image
        run: docker push pharmalogy/pharmalogy-backend:prod

      - name: Push Worker Docker Image
        run: docker push pharmalogy/pharmalogy-worker:prod

      ####################################################
      # DEPLOY TO PRODUCTION EC2
      ####################################################
      - name: Deploy to Production EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST || secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SERVER_SSH_KEY || secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~
            bash deploy.sh
