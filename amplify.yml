version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          if [ "$AWS_APP_ID" = "d8zdjo53e2w9h" ] || [ "$AMPLIFY_MONOREPO_APP_ROOT" = "admin-frontend" ] || [ "$BUILD_TARGET" = "admin" ]; then
            echo "🚀 Target detected: admin-frontend"
            cd admin-frontend
            npm install
          else
            echo "🚀 Target detected: main frontend"
            cd frontend
            npm install --legacy-peer-deps
          fi
    build:
      commands:
        - |
          if [ "$AWS_APP_ID" = "d8zdjo53e2w9h" ] || [ "$AMPLIFY_MONOREPO_APP_ROOT" = "admin-frontend" ] || [ "$BUILD_TARGET" = "admin" ]; then
            echo "🔨 Building admin-frontend (Vite)..."
            cd admin-frontend
            npm run build
            cd ..
            mkdir -p frontend/build
            rm -rf frontend/build/*
            cp -r admin-frontend/dist/* frontend/build/
          else
            echo "🔨 Building main frontend (React)..."
            cd frontend
            # No source maps in production: they publish the full source code
            GENERATE_SOURCEMAP=false npm run build
          fi
  artifacts:
    baseDirectory: frontend/build
    files:
      - "**/*"
  cache:
    paths:
      - frontend/node_modules/**/*
      - admin-frontend/node_modules/**/*
