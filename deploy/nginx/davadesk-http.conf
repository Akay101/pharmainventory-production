# /etc/nginx/conf.d/davadesk-http.conf — http-level settings for the DavaDesk API
# Rate limits per client IP. The API applies its own per-user limits on top
# (backend-node/middleware/security.js); these stop floods before they reach Node.

limit_req_zone  $binary_remote_addr zone=dd_api:20m    rate=30r/s;
limit_req_zone  $binary_remote_addr zone=dd_auth:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr zone=dd_search:10m rate=8r/s;
limit_req_zone  $binary_remote_addr zone=dd_public:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=dd_conn:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

server_tokens off;

# JSON responses were sent uncompressed: nginx doesn't gzip proxied responses by default
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain text/csv application/xml image/svg+xml;

# Keep-alive to Node unless the client is upgrading the connection
map $http_upgrade $dd_connection {
    default upgrade;
    ''      '';
}

# Timestamped access log with upstream timing, for latency checks
log_format dd_timed '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
