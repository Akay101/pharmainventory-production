# /etc/nginx/snippets/davadesk-proxy.conf — shared proxy settings
proxy_pass http://davadesk_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite, never append: a client-supplied X-Forwarded-For can't spoof its IP
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $dd_connection;
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
# Assistant replies stream; buffering would hold them back
proxy_buffering off;
proxy_next_upstream off;
