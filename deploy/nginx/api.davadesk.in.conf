# /etc/nginx/sites-available/default — api.davadesk.in

# Requests by bare IP or an unknown Host are dropped (scanners, Host spoofing)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.davadesk.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.davadesk.in;

    ssl_certificate /etc/letsencrypt/live/api.davadesk.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.davadesk.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/api.access.log dd_timed;
    error_log  /var/log/nginx/api.error.log warn;

    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn dd_conn 60;

    # Liveness for uptime monitors (cheap, not rate limited, not logged)
    location = /health {
        access_log off;
        include snippets/davadesk-proxy.conf;
    }

    # Ops tools are not public: reach them through an SSH tunnel to the container port
    location ^~ /admin/   { return 404; }
    location ^~ /api-docs { return 404; }

    # Credential and OTP endpoints
    location ~ ^/api/(auth/(login|register|forgot-password|reset-password|verify-otp|resend-otp)|users/verify)$ {
        limit_req zone=dd_auth burst=10 nodelay;
        limit_req zone=dd_api  burst=80 nodelay;
        include snippets/davadesk-proxy.conf;
    }

    # Catalogue searches (global medicines, doctors, distributors): scraping targets
    location ~ ^/api/(medicines/(search|search-suggestions|enrich)|bills/doctors|suppliers) {
        limit_req zone=dd_search burst=30 nodelay;
        limit_req zone=dd_api    burst=80 nodelay;
        include snippets/davadesk-proxy.conf;
    }

    # Public bill links (no login)
    location ^~ /api/public/ {
        limit_req zone=dd_public burst=10 nodelay;
        include snippets/davadesk-proxy.conf;
    }

    # Payment webhooks: signature-checked by the API; never throttled
    location ^~ /api/webhook/ {
        include snippets/davadesk-proxy.conf;
    }

    location / {
        limit_req zone=dd_api burst=80 nodelay;
        include snippets/davadesk-proxy.conf;
    }
}
