<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'">
<title>DavaDesk</title>
<style>
:root { --bg:#f5f7f7; --card:#fff; --fg:#17282a; --muted:#5a6c6f; --line:#d6dfdf; --accent:#ea7a1e; --bad:#a3322b; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b0d0d; --card:#161a1a; --fg:#eef2f2; --muted:#9fb0b2; --line:#2c3535; --bad:#f09a92; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif; }
main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px; display:grid; gap:14px; }
h1 { font-size:22px; margin:0; } p { margin:0; } .muted { color:var(--muted); font-size:13.5px; }
button { font:inherit; font-weight:600; padding:10px 16px; border-radius:8px; border:1px solid var(--accent); cursor:pointer; background:var(--accent); color:#fff; width:100%; }
button.ghost { background:transparent; color:var(--accent); width:auto; padding:6px 10px; border-color:transparent; }
button:disabled { opacity:.6; cursor:default; }
button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
input { font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); width:100%; }
.bar { height:8px; border-radius:6px; background:var(--line); overflow:hidden; } .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
.error { color:var(--bad); font-weight:600; }
details { font-size:13.5px; color:var(--muted); } details > div { display:grid; gap:8px; margin-top:8px; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Welcome to DavaDesk</h1>
  <p id="message" class="muted">Sign in with your DavaDesk account. An active subscription is needed. This needs internet once; after that you can work offline.</p>
  <button id="signIn">Sign in with your browser</button>
  <p id="waiting" class="muted" hidden>Waiting for you to allow this computer in your browser…</p>
  <div id="copying" hidden style="display:grid;gap:8px"><p id="copyLabel" class="muted"></p><div class="bar"><div id="copyBar"></div></div></div>
  <button id="update" hidden>Update DavaDesk</button>
  <button id="continueSetup" class="ghost" hidden>Continue now, and finish this in the background</button>
  <p id="error" class="error" role="alert" hidden></p>
  <details id="manual"><summary>The browser showed a code</summary><div><input id="code" aria-label="Sign-in code" autocomplete="off" spellcheck="false"><button id="submit" class="ghost">Use this code</button></div></details>
  <button id="counters" class="ghost">Connect to a main computer instead</button>
</main>
<script src="gate.js"></script>
</body>
</html>
