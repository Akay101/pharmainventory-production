customHeaders:
  # Security headers for the web apps served by Amplify (store and admin).
  # No CSP or Permissions-Policy here on purpose: the app needs the camera
  # (scanning) and microphone (voice), and loads fonts from Google.
  - pattern: "**"
    headers:
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains"
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
